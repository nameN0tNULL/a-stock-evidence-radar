name: CI

on:
  push:
    branches:
      - "agent/**"
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply pending agent patch
        id: patch
        shell: bash
        run: |
          if [ -f .github/agent.patch ]; then
            git apply --whitespace=fix .github/agent.patch
            rm .github/agent.patch
            echo "applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "applied=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,browser]"

      - name: Run tests
        run: python -m pytest -q

      - name: Run Ruff
        run: ruff check src tests scripts

      - name: Commit validated patch
        if: github.event_name == 'push' && steps.patch.outputs.applied == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden live source ingestion [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

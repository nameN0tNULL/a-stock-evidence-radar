name: CI

on:
  push:
    branches:
      - "agent/**"
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply pending agent patch
        id: patch
        shell: bash
        run: |
          if [ -f .github/agent.patch ]; then
            git apply --recount --whitespace=fix \
              --include=src/a_stock_radar/browser_fetcher.py \
              --include=src/a_stock_radar/exchange_fetcher.py \
              --include=tests/test_browser_fetcher.py \
              --include=tests/test_exchange_fetcher.py \
              .github/agent.patch
            rm .github/agent.patch
            echo "applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "applied=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,browser]"

      - name: Run tests
        run: python -m pytest -q

      - name: Run Ruff
        run: ruff check src tests scripts

      - name: Commit validated patch
        if: steps.patch.outputs.applied == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden live source ingestion"
          TARGET_BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git push origin "HEAD:${TARGET_BRANCH}"

name: Integrate free market aggregation

on:
  pull_request:
    branches: [main]

jobs:
  integrate:
    if: github.head_ref == 'agent/fix-live-source-resilience'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fix-live-source-resilience
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Wire market aggregator into provider
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/a_stock_radar/sources.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "from .exchange_fetcher import OfficialExchangeFetcher\n",
              "from .exchange_fetcher import OfficialExchangeFetcher\n"
              "from .market_fetcher import FreeMarketAggregator, TencentMarketAdapter\n",
          )
          text = text.replace(
              "        self.ak = ak\n        self.browser_adapter = (\n",
              "        self.ak = ak\n"
              "        self.tencent_market_adapter = TencentMarketAdapter()\n"
              "        self.market_aggregator = FreeMarketAggregator()\n"
              "        self.browser_adapter = (\n",
          )
          start = text.index(
              "        market, market_error = self._safe(self.ak.stock_zh_a_spot_em)"
          )
          end = text.index("\n\n        etf_spot,", start)
          market_block = '''        browser_market_fetch = (
              self.browser_adapter.fetch_market_spot
              if self.browser_adapter is not None
              else None
          )
          market_result = self.market_aggregator.fetch(
              tencent_fetch=self.tencent_market_adapter.fetch_market_spot,
              eastmoney_fetch=self.ak.stock_zh_a_spot_em,
              browser_fetch=browser_market_fetch,
              sina_fetch=self.ak.stock_zh_a_spot,
          )
          market_norm = self._normalize_market(market_result.frame, trade_date)
          market_errors: list[str] = []
          for attempt in market_result.attempts:
              if attempt.error:
                  market_errors.append(f"{attempt.display_name}: {attempt.error}")
              qualities.append(
                  _quality(
                      attempt.source_id,
                      attempt.display_name,
                      trade_date,
                      not attempt.frame.empty,
                      len(attempt.frame),
                      False,
                      "L2",
                      trade_date if not attempt.frame.empty else None,
                      attempt.error,
                  )
              )
          qualities.append(
              _quality(
                  "market_aggregate",
                  "A股免费行情多源聚合",
                  trade_date,
                  not market_norm.empty,
                  len(market_norm),
                  False,
                  "L2",
                  trade_date if not market_norm.empty else None,
                  "; ".join(market_errors) or None,
              )
          )'''
          text = text[:start] + market_block + text[end:]

          method_start = text.index(
              "    @staticmethod\n    def _normalize_market("
          )
          method_end = text.index("\n\n    def _normalize_etf(", method_start)
          method = '''    @staticmethod
          def _normalize_market(frame: pd.DataFrame, trade_date: date) -> pd.DataFrame:
              if frame.empty:
                  return pd.DataFrame()
              rename = {
                  "代码": "security_code",
                  "名称": "security_name",
                  "最新价": "close",
                  "涨跌幅": "pct_change",
                  "成交额": "amount",
                  "流通市值": "float_market_cap",
                  "换手率": "turnover_rate",
              }
              result = frame.rename(columns=rename)
              required = [
                  "security_code",
                  "security_name",
                  "close",
                  "pct_change",
                  "amount",
              ]
              if any(column not in result for column in required):
                  return pd.DataFrame()
              wanted = [
                  *required,
                  "float_market_cap",
                  "turnover_rate",
                  "source_id",
                  "source_count",
              ]
              result = result[[column for column in wanted if column in result]].copy()
              result["security_code"] = result["security_code"].astype(str).str.zfill(6)
              for column in [
                  "close",
                  "pct_change",
                  "amount",
                  "float_market_cap",
                  "turnover_rate",
              ]:
                  if column in result:
                      result[column] = _numeric(result[column])
              result["trade_date"] = trade_date
              if "source_id" not in result:
                  result["source_id"] = "market_spot"
              if "source_count" not in result:
                  result["source_count"] = 1
              return result.dropna(subset=["security_code", "pct_change"])
          '''
          text = text[:method_start] + method + text[method_end:]
          path.write_text(text, encoding="utf-8")
          PY
          git checkout 3dcbb79578d1c28d74d4555ffe39dcfa8f4bb748 -- .github/workflows/radar_daily.yml

      - name: Validate
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,browser]"
          python -m pytest -q
          ruff check src tests scripts

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/radar_daily.yml src/a_stock_radar/sources.py
          git commit -m "feat: use aggregated free market sources"
          git push origin HEAD:agent/fix-live-source-resilience

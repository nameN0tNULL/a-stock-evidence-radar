  eastmoney_lhb:
    display_name: 东方财富龙虎榜
    role: seat_facts_and_history
    evidence_level: L2
    official: false
    adapter: akshare.stock_lhb_detail_em
    companion_adapters:
      - akshare.stock_lhb_jgmmtj_em
      - akshare.stock_lhb_hyyyb_em
      - akshare.stock_lhb_yybph_em
      - akshare.stock_lhb_traderstatistic_em

  dazhihui:
    display_name: 大智慧DDE/ACE
    role: level2_behavior
    evidence_level: L3
    official: false
    import_dir: imports/dazhihui
    env_path: RADAR_DAZHIHUI_DDE_EXPORT
    access: licensed_export_or_authorized_endpoint

  cls:
    display_name: 财联社龙虎榜
    role: seat_fact_corroboration
    evidence_level: L2
    official: false
    import_dir: imports/cls
    env_path: RADAR_CLS_LHB_EXPORT
    access: authorized_export_only

  daily_stock_analysis:
    display_name: daily_stock_analysis
    role: report_architecture
    evidence_level: L4
    official: false
    import_dir: imports/daily_stock_analysis
    env_path: RADAR_DAILY_STOCK_ANALYSIS_ARTIFACT

  tradingagents_cn:
    display_name: TradingAgents-CN
    role: debate_reference
    evidence_level: L4
    official: false
    import_dir: imports/tradingagents_cn
    env_path: RADAR_TRADINGAGENTS_CN_ARTIFACT
